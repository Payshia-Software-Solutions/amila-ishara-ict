<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="600" cy="337" r="300" fill="url(#glow)" />

  <!-- Abstract Tech Rings -->
  <circle cx="600" cy="270" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="600" cy="270" r="85" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Central Tech / Monitor Icon -->
  <g transform="translate(560, 230)">
    <rect x="0" y="0" width="80" height="55" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#818cf8" stroke-width="3" />
    <line x1="20" y1="20" x2="40" y2="20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="32" x2="60" y2="32" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <path d="M 30 55 L 20 75 L 60 75 L 50 55 Z" fill="#818cf8" opacity="0.5" />
  </g>

  <!-- Central Text -->
  <text x="600" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    AMILA ISHARA ICT
  </text>
  <text x="600" y="485" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Replace this with your image in the public/ folder (e.g., hero.jpg)
  </text>

  <!-- Decorative Corner Accents -->
  <path d="M 40 80 L 40 40 L 80 40" stroke="url(#accentGrad)" stroke-width="3" fill="none" />
  <path d="M 1120 40 L 1160 40 L 1160 80" stroke="url(#accentGrad)" stroke-width="3" fill="none" />
  <path d="M 40 595 L 40 635 L 80 635" stroke="url(#accentGrad)" stroke-width="3" fill="none" />
  <path d="M 1120 635 L 1160 635 L 1160 595" stroke="url(#accentGrad)" stroke-width="3" fill="none" />
</svg>
